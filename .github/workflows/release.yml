name: Create versioned release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify synchronized version files
        run: npm run version:check

      - name: Validate production build
        run: npm run build

      - name: Verify tag matches the central version
        shell: bash
        run: |
          VERSION="$(node -e "import('./version.js').then(module => process.stdout.write(module.VERSION))")"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version.js value v${VERSION}."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --generate-notes
          --title "Nadeesha Portfolio ${GITHUB_REF_NAME}"
